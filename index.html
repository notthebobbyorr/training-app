<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#eceeed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
/* Layout idea: one-screen phone app. Fixed header and bottom tabs, a single scrolling column of cards.
   Set notation is monospaced because it is typed and read like code. Macro colors borrow bumper-plate colors. */
:root{
  --bg:#eceeed; --surface:#fbfcfb; --ink:#15191b; --muted:#647077; --line:#d3d9d6;
  --accent:#1d4fbf; --accent-ink:#ffffff; --tint:#e3eafb;
  --p:#c0392d; --c:#b98a08; --f:#2a66c8; --warn:#a8481a;
  --display:"Avenir Next Condensed","AvenirNextCondensed-DemiBold","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1214; --surface:#181c1f; --ink:#eceeed; --muted:#98a2a8; --line:#2a3035;
    --accent:#7ba3ff; --accent-ink:#0b1020; --tint:#1c2740;
    --p:#f07467; --c:#e3b93c; --f:#6aa5ff; --warn:#f0935e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#181c1f; --ink:#eceeed; --muted:#98a2a8; --line:#2a3035;
  --accent:#7ba3ff; --accent-ink:#0b1020; --tint:#1c2740;
  --p:#f07467; --c:#e3b93c; --f:#6aa5ff; --warn:#f0935e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
#backup-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
#backup-btn.due{border-color:var(--warn);color:var(--warn)}
#status{text-align:right}
h1{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
#status{font-size:13px;color:var(--muted)}
#status.bad{color:var(--warn);font-weight:600}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0 14px;font:600 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}

.datebar{display:flex;align-items:stretch;gap:8px}
.datebar>button{width:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:22px;line-height:1}
.datelabel{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.datelabel b{font:700 22px/1.1 var(--display);letter-spacing:.02em}
.datelabel small{font-size:12px;color:var(--muted)}
.datelabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;text-align:left}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
h2{font:700 21px/1.1 var(--display);letter-spacing:.02em;margin:0}
h3{font:600 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.lifttitle{border:0;background:none;padding:0;text-align:left;font:700 21px/1.1 var(--display);letter-spacing:.02em;color:var(--ink)}
.lifttitle::after{content:" ›";color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px}
input[type=text],input[type=search],input[type=number],textarea,.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px}
textarea{resize:vertical;min-height:110px;line-height:1.45}
.sets{font:500 16px/1.4 var(--mono)}
.mono{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.last{background:var(--tint);border-radius:8px;padding:7px 10px;font-size:14px}
.last .when{color:var(--muted);font-size:12.5px;display:block}
.note{color:var(--muted);font-size:14px;font-style:italic;overflow-wrap:anywhere}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.chip[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cues button{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:7px 2px;font-size:16px;border-bottom:1px dashed var(--line)}
.cues button::before{content:"";flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--muted);border-radius:5px}
.cues button.on{color:var(--muted);text-decoration:line-through}
.cues button.on::before{background:var(--accent);border-color:var(--accent)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 14px;font-weight:600}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:10px 14px;font-weight:600}
.danger{color:var(--warn)}
.results{display:flex;flex-direction:column}
.results button,.listrow{display:flex;flex-direction:column;gap:2px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 2px}
.results button:first-child{border-top:0}
.listrow b,.results b{font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.list .listrow:first-child{border-top:0}
.day b{font:700 17px/1.2 var(--display);letter-spacing:.03em}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.banner{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}

.totals{gap:12px}
.kcal b{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.kcal span{color:var(--muted);margin-left:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros div{border-left:4px solid var(--line);padding-left:8px}
.macros b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.macros span{font-size:12.5px;color:var(--muted)}
.macros .p{border-color:var(--p)}.macros .c{border-color:var(--c)}.macros .f{border-color:var(--f)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.split i{display:block}.split .p{background:var(--p)}.split .c{background:var(--c)}.split .f{background:var(--f)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.amt{display:flex;align-items:center;gap:6px}
.amt input{width:84px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.num{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:999px;padding:9px 8px 9px 16px;display:none;align-items:center;gap:10px;font-size:14px;z-index:5;white-space:nowrap}
#toast button{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.cues button,.chip{transition:color .15s,background .15s}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Training Log</h1><span id="status" role="status" class="grow"></span><button id="backup-btn" data-tab="backup">Backup</button></header>
  <main id="main"></main>
  <nav>
    <button data-tab="log" aria-current="true">Log</button>
    <button data-tab="lifts">Lifts</button>
    <button data-tab="food">Food</button>
  </nav>
</div>
<div id="toast"><span id="toast-text"></span><button data-act="undo">Undo</button></div>
<script>
"use strict";
/* ---------- state ---------- */
const COLLS = ["workouts","lifts","foods","meals"];
const S = {workouts:{},lifts:{},foods:{},meals:{}};
const loaded = {};
let db = null, dbState = "loading"; // loading | ok | none | slow
const UI = {tab:"log", logDate:today(), foodDate:today(), liftId:null, back:null, liftQ:"", pickerOpen:false,
  liftsQ:"", cuesOpen:{}, ticks:{}, moreDays:14, food:{mode:"idle", q:"", open:false}};
const $ = s => document.querySelector(s);
const main = $("#main");

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function toDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function shift(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return iso(d)}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(s){const d=toDate(s);const y=d.getFullYear()!==new Date().getFullYear()?"/"+String(d.getFullYear()).slice(2):"";return DOW[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate()+y}
function ago(s){const n=Math.round((toDate(today())-toDate(s))/864e5);
  if(n===0)return"today";if(n===1)return"yesterday";if(n>1)return n+" days ago";if(n===-1)return"tomorrow";return"in "+(-n)+" days"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(v){return JSON.parse(JSON.stringify(v))}
function stable(v){return JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x)}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"lift"}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}
function r1(n){return (Math.round(n*10)/10).toLocaleString("en-US")}
function r0(n){return Math.round(n).toLocaleString("en-US")}

/* ---------- saving: everything lives in this browser's storage on the phone ---------- */
const KEY="traininglog.v1.";
const timers={}; let saveErr="";
function writeColl(c){clearTimeout(timers[c]);timers[c]=null;
  try{localStorage.setItem(KEY+c,JSON.stringify(S[c]));saveErr=""}catch(e){saveErr="Couldn't save. Phone storage is full or blocked."}showStatus()}
function touch(coll){clearTimeout(timers[coll]);timers[coll]=setTimeout(()=>writeColl(coll),300)}
function flushAll(){for(const c of COLLS)if(timers[c])writeColl(c)}
function lastBackup(){try{return localStorage.getItem(KEY+"lastBackup")||""}catch(e){return""}}
function hasData(){return COLLS.some(c=>Object.keys(S[c]).length)}
function backupDue(){const l=lastBackup();return hasData()&&(!l||(Date.now()-new Date(l).getTime())>30*864e5)}
function showStatus(){const el=$("#status");el.textContent=saveErr;el.className="grow"+(saveErr?" bad":"");$("#backup-btn").classList.toggle("due",backupDue())}

/* ---------- data access ---------- */
function workout(date,create){
  let w=S.workouts[date];
  if(!w&&create){w=S.workouts[date]={date,note:"",entries:[]}}
  return w;
}
function saveWorkout(date){
  const w=S.workouts[date];
  if(w&&!w.entries.length&&!(w.note||"").trim()) delete S.workouts[date];
  touch("workouts",date);
}
function meal(date,create){
  let m=S.meals[date];
  if(!m&&create){m=S.meals[date]={date,items:[]}}
  return m;
}
function saveMeal(date){const m=S.meals[date];if(m&&!m.items.length)delete S.meals[date];touch("meals",date)}
function liftName(id){return (S.lifts[id]&&S.lifts[id].name)||id}
function cueLines(id){return ((S.lifts[id]&&S.lifts[id].cues)||"").split("\n").map(s=>s.trim()).filter(Boolean)}
/* every session of every lift, newest first: {liftId:[{date,entry}]} */
function historyIndex(){
  const H={};
  for(const date of Object.keys(S.workouts).sort().reverse())
    for(const e of S.workouts[date].entries||[]) (H[e.lift]=H[e.lift]||[]).push({date,entry:e});
  return H;
}
/* his notation: weight-reps-reps weight-reps. Returns the heaviest weight seen and reps there, or null. */
function heaviest(str){
  let best=null, cur=null;
  for(const tok of String(str||"").trim().split(/\s+/)){
    if(tok[0]==="-"&&cur){const r=parseFloat(tok.slice(1));if(r&&cur===best)best.r=Math.max(best.r||0,r);continue}
    const m=tok.match(/^(\d+(?:\.\d+)?)(?:s|lbs?|dbs?|kg)?((?:-[\d+]*)*)$/i);
    if(!m){cur=null;continue}
    const parts=m[2].split("-").filter(Boolean).map(p=>parseFloat(p)).filter(n=>!isNaN(n));
    let sets;
    if(parts.some(n=>n>=60)) sets=[+m[1],...parts].map(w=>({w,r:0})); // a chain of weights with no reps
    else sets=[{w:+m[1],r:parts.length?Math.max(...parts):0}];
    for(const s of sets){cur=s;if(!best||s.w>best.w||(s.w===best.w&&s.r>best.r))best=s}
  }
  return best&&best.w>=20?best:null;
}
function kcal(f){return f.cal!==""&&f.cal!=null?num(f.cal):4*num(f.p)+4*num(f.c)+9*num(f.f)}
function itemTotals(it){const s=num(it.size)>0?num(it.amount)/num(it.size):0;return{s,cal:s*kcal(it),p:s*num(it.p),c:s*num(it.c),f:s*num(it.f)}}
function dayTotals(date){
  const t={cal:0,p:0,c:0,f:0};const m=S.meals[date];
  if(m)for(const it of m.items){const x=itemTotals(it);t.cal+=x.cal;t.p+=x.p;t.c+=x.c;t.f+=x.f}
  return t;
}
function servingsText(n){const v=Math.round(n*100)/100;return v+(v===1?" serving":" servings")}

/* ---------- rendering ---------- */
let renderWanted=false;
function editing(){const a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)}
function requestRender(){if(editing()){renderWanted=true}else render()}
function render(){
  renderWanted=false;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===UI.tab)));
  if(dbState==="loading"){main.innerHTML='<p class="empty">Loading your log…</p>';return}
  let h="";
  if(dbState==="none") h+='<div class="banner">Your saved data can\'t be reached in this view, so anything you enter here won\'t be kept. Open the page while signed in to Claude.</div>';
  if(dbState==="slow") h+='<div class="banner">Your data can\'t be reached yet. Still trying.</div>';
  if(!hasData()&&UI.tab!=="backup") h+='<div class="banner">Nothing on this phone yet. To bring in your existing history, tap Backup at the top and choose your history file.</div>';
  h+= UI.tab==="backup"?viewBackup(): UI.tab==="log"?viewLog(): UI.tab==="lifts"?(UI.liftId?viewLift():viewLifts()): viewFood();
  main.innerHTML=h;
}
function dateBar(date,scope){
  const t=today();
  return '<div class="datebar"><button data-act="day" data-scope="'+scope+'" data-n="-1" aria-label="Previous day">‹</button>'
   +'<label class="datelabel"><b>'+fmtDate(date)+'</b><small>'+(date===t?"Today":ago(date))+'</small>'
   +'<input type="date" id="date-'+scope+'" data-date="'+scope+'" value="'+date+'" aria-label="Pick a date"></label>'
   +'<button data-act="day" data-scope="'+scope+'" data-n="1" aria-label="Next day">›</button></div>'
   +(date!==t?'<button class="linkbtn" data-act="today" data-scope="'+scope+'">Jump to today</button>':"");
}
function lastBefore(H,liftId,date){return (H[liftId]||[]).find(x=>x.date<date&&((x.entry.sets||"").trim()||(x.entry.note||"").trim()))}
function viewLog(){
  const date=UI.logDate, w=workout(date)||{note:"",entries:[]}, H=historyIndex();
  let h=dateBar(date,"log");
  h+='<input type="text" id="daynote" data-in="daynote" value="'+esc(w.note)+'" placeholder="Note for the day (hotel gym, planks throughout…)" aria-label="Note for the day">';
  for(const e of w.entries){
    const cues=cueLines(e.lift), last=lastBefore(H,e.lift,date);
    const open=e.id in UI.cuesOpen?UI.cuesOpen[e.id]:(cues.length>0&&!(e.sets||"").trim());
    const ticks=UI.ticks[e.id]||{};
    h+='<section class="card"><div class="row"><button class="lifttitle grow" data-act="open-lift" data-id="'+esc(e.lift)+'">'+esc(liftName(e.lift))+'</button>'
      +'<button class="x" data-act="rm-entry" data-e="'+e.id+'" aria-label="Remove '+esc(liftName(e.lift))+'">×</button></div>';
    if(last) h+='<div class="last"><span class="when">Last time · '+fmtDate(last.date)+' · '+ago(last.date)+'</span><span class="mono">'+esc(last.entry.sets||"no sets logged")+'</span>'
      +(last.entry.note?'<div class="note">'+esc(last.entry.note)+'</div>':"")+'</div>';
    else h+='<div class="sub">First time logging this lift.</div>';
    h+='<input type="text" class="sets" id="sets-'+e.id+'" data-in="sets" data-e="'+e.id+'" value="'+esc(e.sets)+'" placeholder="bar 135-5 185-5-5" aria-label="Sets for '+esc(liftName(e.lift))+'" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">'
      +'<input type="text" id="enote-'+e.id+'" data-in="enote" data-e="'+e.id+'" value="'+esc(e.note)+'" placeholder="How did it go?" aria-label="Note for '+esc(liftName(e.lift))+'">';
    h+='<div class="row">'+(cues.length
        ?'<button class="chip" data-act="toggle-cues" data-e="'+e.id+'" aria-expanded="'+open+'">Cues ('+cues.length+')</button>'
        :'<button class="chip" data-act="edit-cues" data-id="'+esc(e.lift)+'">Add cues</button>')+'</div>';
    if(cues.length&&open) h+='<ul class="cues">'+cues.map((c,i)=>'<li><button data-act="tick" data-e="'+e.id+'" data-i="'+i+'" class="'+(ticks[i]?"on":"")+'">'+esc(c)+'</button></li>').join("")
        +'</ul><button class="linkbtn" data-act="edit-cues" data-id="'+esc(e.lift)+'">Edit cues</button>';
    h+='</section>';
  }
  h+='<section class="card"><input type="search" id="lift-q" data-in="lift-q" value="'+esc(UI.liftQ)+'" placeholder="Add a lift: search or type a new one" aria-label="Add a lift" autocomplete="off" autocorrect="off">'
    +'<div class="results" id="lift-results">'+(UI.pickerOpen?liftResults(H):"")+'</div></section>';
  const days=Object.keys(S.workouts).filter(d=>d!==date).sort().reverse();
  if(days.length){
    h+='<h3>Other days</h3><div class="list">'+days.slice(0,UI.moreDays).map(d=>dayRow(d)).join("")+'</div>';
    if(days.length>UI.moreDays) h+='<button class="ghost" data-act="more-days">Show older days</button>';
  }
  return h;
}
function dayRow(d){
  const w=S.workouts[d];
  return '<button class="listrow day" data-act="open-day" data-date="'+d+'"><span><b>'+fmtDate(d)+'</b> <span class="sub">'+ago(d)+(w.note?" · "+esc(w.note):"")+'</span></span>'
    +(w.entries||[]).map(e=>'<span class="mono"><b>'+esc(liftName(e.lift))+'</b> '+esc(e.sets||"")+'</span>').join("")+'</button>';
}
function matchLifts(q,H){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  return Object.keys(S.lifts).filter(id=>{const n=liftName(id).toLowerCase();return words.every(w=>n.includes(w))})
    .sort((a,b)=>{const da=H[a]?H[a][0].date:"", dbb=H[b]?H[b][0].date:"";return da===dbb?liftName(a).localeCompare(liftName(b)):(da<dbb?1:-1)});
}
function liftResults(H){
  H=H||historyIndex(); const q=UI.liftQ.trim(); const ids=matchLifts(q,H);
  let h=ids.slice(0,q?12:8).map(id=>'<button data-act="pick-lift" data-id="'+esc(id)+'"><b>'+esc(liftName(id))+'</b><span class="sub">'

function liftsList(ids,H){

function viewLift(){

  let top=null; for(const x of hist){const b=heaviest(x.entry.sets);if(b&&(!top||b.w>top.w||(b.w===top.w&&b.r>top.r)))top={w:b.w,r:b.r,date:x.date}}

    +'<button class="primary" data-act="log-lift" data-id="'+esc(id)+'">Log this lift today</button></section>';
  h+='<section class="card"><label for="cues"><h2>Cues</h2></label><div class="sub">One per line. They show up as a checklist beside this lift in the log.</div>'
    +'<textarea id="cues" data-in="cues" placeholder="Brace before the unrack&#10;Bar over mid-foot&#10;…">'+esc(L.cues||"")+'</textarea></section>';
  h+='<h3>History</h3>';
  if(!hist.length) h+='<p class="empty">Nothing logged for this lift yet.</p><button class="ghost danger" data-act="del-lift" data-id="'+esc(id)+'">Delete this lift</button>';
  else h+='<div class="list">'+hist.map(x=>'<button class="listrow day" data-act="open-day" data-date="'+x.date+'"><span><b>'+fmtDate(x.date)+'</b> <span class="sub">'+ago(x.date)+'</span></span>'
      +'<span class="mono">'+esc(x.entry.sets||"no sets logged")+'</span>'+(x.entry.note?'<span class="note">'+esc(x.entry.note)+'</span>':"")+'</button>').join("")+'</div>';
  return h;
}

/* ---------- food ---------- */
function totalsHtml(date){
  const t=dayTotals(date), pc=4*t.p, cc=4*t.c, fc=9*t.f, sum=pc+cc+fc||1;
  return '<div class="kcal"><b>'+r0(t.cal)+'</b><span>calories</span></div>'
    +'<div class="macros"><div class="p"><b>'+r1(t.p)+'</b><span>g protein</span></div><div class="c"><b>'+r1(t.c)+'</b><span>g carbs</span></div><div class="f"><b>'+r1(t.f)+'</b><span>g fat</span></div></div>'
    +'<div class="split" role="img" aria-label="Share of calories from protein, carbs and fat"><i class="p" style="width:'+(pc/sum*100)+'%"></i><i class="c" style="width:'+(cc/sum*100)+'%"></i><i class="f" style="width:'+(fc/sum*100)+'%"></i></div>';
}
function macroLine(x){return r0(x.cal)+' cal · '+r1(x.p)+'P · '+r1(x.c)+'C · '+r1(x.f)+'F'}
function itemCalc(it){const x=itemTotals(it);return servingsText(x.s)+' · '+macroLine(x)}
function foodPer(f){return 'Per '+f.size+' '+esc(f.unit||"")+': '+macroLine({cal:kcal(f),p:num(f.p),c:num(f.c),f:num(f.f)})}
function viewFood(){

     '<div class="item"><div class="grow"><b>'+esc(it.name)+'</b><div class="sub num" id="calc-'+it.id+'">'+itemCalc(it)+'</div></div>'
     +'<div class="amt"><input type="number" inputmode="decimal" step="any" min="0" id="amt-'+it.id+'" data-in="item-amt" data-i="'+it.id+'" value="'+esc(it.amount)+'" aria-label="Amount of '+esc(it.name)+' eaten"><span class="sub">'+esc(it.unit||"")+'</span>'

      +'<div class="sub">Macros in one serving</div><div class="grid4">'+fld("cal","Calories","n","auto")+fld("p","Protein g","n","0")+fld("c","Carbs g","n","0")+fld("f","Fat g","n","0")+'</div>'
      +'<div class="sub">Leave calories blank to work them out from the macros.</div>'
      +(F.editId?"":fld("amount","How much did you eat? (same unit)","n",""))
      +'<div class="sub danger" id="ff-err"></div>'
      +'<div class="row"><button class="primary grow" data-act="food-save">'+(F.editId?"Save food":"Save and add to "+fmtDate(date))+'</button><button class="ghost" data-act="food-cancel">Cancel</button></div>'

function foodResults(){
  const q=UI.food.q.trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean);
  const ids=Object.keys(S.foods).filter(id=>words.every(w=>S.foods[id].name.toLowerCase().includes(w))).sort((a,b)=>S.foods[a].name.localeCompare(S.foods[b].name));
  if(!ids.length) return '<span class="sub" style="padding:8px 2px">'+(Object.keys(S.foods).length?"No saved food matches. Use New food.":"No saved foods yet. Use New food to enter your first one; it will be saved for next time.")+'</span>';

function addEntry(liftId,date){

  day(d){const k=d.scope==="log"?"logDate":"foodDate";UI[k]=shift(UI[k],+d.n);render()},

  "food-new"(){UI.food={mode:"form",editId:null,q:"",open:false,form:{name:UI.food.q||"",size:"",unit:"g",cal:"",p:"",c:"",f:"",amount:""}};render();const el=$("#ff-name");if(el)el.focus()},
  "food-edit"(d){const f=S.foods[d.id];UI.food={mode:"form",editId:d.id,q:"",open:false,form:{name:f.name,size:f.size,unit:f.unit,cal:f.cal==null?"":f.cal,p:f.p,c:f.c,f:f.f}};render()},

/* ---------- backup ---------- */
function counts(d){return Object.keys(d.workouts||{}).length+" workout days, "+Object.keys(d.lifts||{}).length+" lifts, "+Object.keys(d.foods||{}).length+" foods, "+Object.keys(d.meals||{}).length+" food days"}
function viewBackup(){
  const l=lastBackup();
  return '<section class="card"><h2>Backup</h2><div>Everything you log is stored on this phone only. Nothing is uploaded. Deleting the app from your Home Screen, or clearing Safari website data, erases it, so save a backup file now and then.</div>'
    +'<div class="sub">On this phone: '+counts(S)+'.<br>Last backup: '+(l?fmtDate(iso(new Date(l)))+" ("+ago(iso(new Date(l)))+")":"never")+'.</div>'
    +'<button class="primary" data-act="export">Save a backup file</button><div class="sub danger" id="bk-msg"></div></section>'
    +'<section class="card"><h2>Restore or import</h2><div class="sub">Pick a Training Log backup file. Its days, lifts and foods are added to what is here; a day or lift that exists in both is replaced by the file\'s version.</div>'
    +'<label class="ghost" style="text-align:center;position:relative">Choose a backup file<input type="file" id="import-file" accept=".json,application/json,text/plain" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"></label>'
    +'<div class="sub">Or paste the contents of a backup file here:</div><textarea id="import-text" placeholder="{ &quot;app&quot;: &quot;training-log&quot;, … }" style="min-height:70px" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>'
    +'<button class="ghost" data-act="import-paste">Import pasted backup</button></section>';
}
function importData(text){
  const msg=$("#bk-msg"); let d;
  try{d=JSON.parse(text)}catch(e){if(msg)msg.textContent="That isn't a Training Log backup (it could not be read as JSON).";return}
  if(!d||typeof d!=="object"||!COLLS.some(c=>d[c]&&typeof d[c]==="object")){if(msg)msg.textContent="That file has no Training Log data in it.";return}
  const before=clone(S);
  for(const c of COLLS){if(d[c]&&typeof d[c]==="object"&&!Array.isArray(d[c])){Object.assign(S[c],clone(d[c]));normalize(c);writeColl(c)}}
  UI.tab="log";render();
  toast("Imported "+counts(d).split(",")[0],()=>{for(const c of COLLS){S[c]=before[c];writeColl(c)}render()});
}
ACT.export=async function(){
  flushAll();
  const data={app:"training-log",version:1,exported:new Date().toISOString()};for(const c of COLLS)data[c]=S[c];
  const name="training-log-backup-"+today()+".json", text=JSON.stringify(data,null,1);
  const done=()=>{try{localStorage.setItem(KEY+"lastBackup",new Date().toISOString())}catch(e){}showStatus();render()};
  try{
    const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done();return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()}
  catch(e){$("#bk-msg").textContent="Couldn't create the file on this device."}
};
ACT["import-paste"]=function(){const t=$("#import-text").value.trim();if(t)importData(t)};

/* ---------- start ---------- */
function normalize(coll){
  const next=S[coll];
  if(coll==="workouts")for(const id in next){const w=next[id];w.date=id;w.note=w.note||"";w.entries=Array.isArray(w.entries)?w.entries:[]}
  if(coll==="meals")for(const id in next){const m=next[id];m.date=id;m.items=Array.isArray(m.items)?m.items:[]}
  if(coll==="lifts"||coll==="foods")for(const id in next){next[id].name=String(next[id].name||id)}
}
function start(){
  for(const c of COLLS){try{S[c]=JSON.parse(localStorage.getItem(KEY+c))||{}}catch(e){S[c]={}}if(typeof S[c]!=="object"||Array.isArray(S[c]))S[c]={};normalize(c)}
